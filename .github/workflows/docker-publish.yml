name: Build and publish Docker image

# Builds the update-server image (Dockerfile at repo root) and publishes it
# to GitHub Container Registry. Works unmodified in any fork — the image
# name is derived from the repository itself (github.repository), so a
# fork publishes to ghcr.io/<fork-owner>/<repo-name> with no config needed
# beyond enabling Actions and, once, setting the resulting package's
# visibility to public in GitHub's package settings (Settings > Packages).

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile"
      - "payload/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "payload/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Pull requests from forks don't get repo secrets/tokens with write
        # access, so those runs build (to validate the Dockerfile) but skip
        # login and push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build (and push on non-PR runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
